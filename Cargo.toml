[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Architecture §2.1: panics abort. (Cargo ignores this for test builds.)
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
