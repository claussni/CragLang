[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# No `panic = "abort"` here: the host cancels queries by unwinding. Image
# processes call `crag_runtime::abort_on_panic` at startup instead
# (Architecture §2.1).
