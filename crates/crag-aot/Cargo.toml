[package]
name = "crag-aot"
description = "Crag release builds: the AOT object writer, runtime archives and linking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
crag-abi = { path = "../crag-abi" }
crag-backend = { path = "../crag-backend" }
crag-codegen = { path = "../crag-codegen" }
crag-db = { path = "../crag-db" }
crag-hir = { path = "../crag-hir" }
crag-mir = { path = "../crag-mir" }
crag-receive = { path = "../crag-receive" }
object = { version = "0.37", default-features = false, features = ["std", "elf", "read_core", "write_core"] }

[dev-dependencies]
crag-driver = { path = "../crag-driver" }
