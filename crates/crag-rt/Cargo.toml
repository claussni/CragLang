[package]
name = "crag-rt"
description = "Crag runtime archive: the runtime and the start of a release executable, as a static library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# The archive defines the C `main`, which a test harness would define too.
# `crag-rt-receive` takes it as a library, with the receiver of code.
[lib]
crate-type = ["staticlib", "rlib"]
test = false
doctest = false

[features]
# The receiver of code, for programs that run received code
# (Implementation Plan §11.10.9): the compiler's front end and code
# generator.
receive = ["dep:crag-receive"]

[dependencies]
crag-abi = { path = "../crag-abi" }
crag-receive = { path = "../crag-receive", optional = true }
crag-runtime = { path = "../crag-runtime" }
