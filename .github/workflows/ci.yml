# Builds and tests through ./cargo, so CI uses the toolchain pinned in the
# Dockerfile. Every test runs twice: once as is and once tortured, so every
# fiber starts with the smallest stack and every call moves it (Plan §11.3.9).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .cargo-home
            target
          key: cargo-${{ hashFiles('Dockerfile', 'Cargo.lock') }}
          restore-keys: cargo-
      - name: Format
        run: ./cargo fmt --check
      - name: Clippy
        run: ./cargo clippy --all-targets -- -D warnings
      - name: Test
        run: ./cargo test
      - name: Test tortured
        run: ./cargo test
        env:
          CRAG_TORTURE: "1"
